<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    탭 아이콘. 세 앱(MailBento · MemoBento · PaperBento)이 **같은 뼈대**를
    쓰고 그림만 다르다. 탭이 여럿 떠 있을 때 색이 아니라 모양으로 가려야
    하기 때문이다 — 셋 다 같은 팔레트를 쓴다.

    색은 CSS 변수를 쓸 수 없다. 파비콘은 문서 밖에서 그려져 우리 :root 가
    닿지 않는다. Forest 라이트의 값을 옮겨 박는다.
      bg #fdf9f7 · border #c7c3c1 · accent #008b1d

    그림은 **봉투**.
  -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.5" fill="#fdf9f7" stroke="#c7c3c1" stroke-width="1.5" />
  <g fill="none" stroke="#008b1d" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="7" y="10" width="18" height="12" rx="2.5" />
    <path d="M7.8 11.2 16 17l8.2-5.8" />
  </g>
</svg>
