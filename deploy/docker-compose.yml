# ============================================================
# Bento — 메일함 · 메모함 · 논문함 · 음성함 · 에이전트 한 벌
# ============================================================
#
#   ./bootstrap.sh          저장소를 받아 다섯 컨테이너를 띄운다
#
# 그리고 브라우저로 http://<주소>:3000 을 열면 설치 마법사가 뜬다. 거기서
# 값을 채우면 다섯 서비스가 이어서 올라온다.
#
# 빌드 자리를 ./src 로 두는 이유는 BentoAgent 가 비공개 저장소이기 때문이다.
# 도커에게 git 주소를 그대로 주면 도커가 스스로 받아야 하는데, 그러려면
# 도커 데몬에 자격 증명을 쥐여 줘야 한다. 받는 일은 사람 계정으로 하고
# 도커에게는 받아 둔 폴더만 준다.

name: MailBento

services:
  # 3000 번. 사람이 처음 닿는 곳이라 설치 마법사도 여기서 뜬다.
  mailbento:
    container_name: MailBento
    build:
      context: ./src/MailBento
      args:
        # 하위 경로에 얹을 때만 채운다 (예: /mail). 옆의 .env 에서 읽는다.
        BASE_PATH: "${MAILBENTO_BASE_PATH:-}"
    restart: unless-stopped
    environment:
      # 이 스택이 설정을 관리한다는 표시. 없으면 진입 스크립트가
      # 예전 방식(환경변수 직접 주입)으로 보고 앱을 바로 띄운다.
      BENTO_MANAGED: "1"
    ports:
      - "${MAILBENTO_PORT:-3000}:3000"
    volumes:
      - ./config:/config
      - ./data/mailbento:/app/data
    networks: [bento]

  # 3001 번(안에서는 3000). 메모·파일이 사는 곳.
  memobento:
    container_name: MemoBento
    build:
      context: ./src/MemoBento
      args:
        BASE_PATH: "${MEMOBENTO_BASE_PATH:-}"
    restart: unless-stopped
    environment:
      # 이 스택이 설정을 관리한다는 표시. 없으면 진입 스크립트가
      # 예전 방식(환경변수 직접 주입)으로 보고 앱을 바로 띄운다.
      BENTO_MANAGED: "1"
    ports:
      - "${MEMOBENTO_PORT:-3001}:3000"
    volumes:
      - ./config:/config
      - ./data/memobento:/app/data
      # 메일함의 DB 를 그대로 본다. Corkboard 와 Memo 메모함은 두 앱이 같은
      # 자료를 쓰기 때문에, 이 마운트가 없으면 한쪽에서 고친 것이 다른 쪽에
      # 보이지 않는다.
      - ./data/mailbento:/app/mailbento
    networks: [bento]
    depends_on: [mailbento]

  # 3002 번(안에서는 3000). 논문 PDF 와 그 위의 메모가 사는 곳.
  #
  # 메모함과 달리 메일함 DB 를 보지 않는다. 나눠 쓰는 자료가 없다 — 논문도
  # 요약도 메모도 전부 이 앱이 소유하는 행이라 자기 볼륨 하나면 된다.
  paperbento:
    container_name: PaperBento
    build:
      context: ./src/PaperBento
      args:
        BASE_PATH: "${PAPERBENTO_BASE_PATH:-}"
    restart: unless-stopped
    environment:
      # 이 스택이 설정을 관리한다는 표시. 없으면 진입 스크립트가
      # 예전 방식(환경변수 직접 주입)으로 보고 앱을 바로 띄운다.
      BENTO_MANAGED: "1"
    ports:
      - "${PAPERBENTO_PORT:-3002}:3000"
    volumes:
      - ./config:/config
      - ./data/paperbento:/app/data
    networks: [bento]
    depends_on: [mailbento]

  # 3003 번(안에서는 3000). 올린 소리·영상을 글로 옮기는 곳.
  #
  # 파일은 자기가 들고 있지 않다. 올린 것은 메모함의 `Voice` 예약 메모함에
  # 놓이고, 여기서는 그 `fileId` 로 읽는다 — 보관하는 곳이 둘이면 같은 바이트가
  # 두 벌 남고 지울 때 한쪽만 지워진다. 그래서 자기 볼륨에는 전사문과 진행
  # 상태만 쌓인다.
  #
  # 모델은 이미지에 굽지 않는다. 671MB 라 런타임 이미지가 562MB 에서 1.7GB 로
  # 불고, 앱을 한 줄 고칠 때마다 그 층을 다시 민다. bootstrap.sh 가 볼륨에
  # 채워 두고 여기서는 읽기만 한다.
  voicebento:
    container_name: VoiceBento
    build:
      context: ./src/VoiceBento
      args:
        BASE_PATH: "${VOICEBENTO_BASE_PATH:-}"
    restart: unless-stopped
    environment:
      # 이 스택이 설정을 관리한다는 표시. 없으면 진입 스크립트가
      # 예전 방식(환경변수 직접 주입)으로 보고 앱을 바로 띄운다.
      BENTO_MANAGED: "1"
    ports:
      - "${VOICEBENTO_PORT:-3003}:3000"
    volumes:
      - ./config:/config
      - ./data/voicebento:/app/data
      # 읽기 전용 — 앱이 모델을 고칠 일이 없고, 실수로 지우는 일도 막는다.
      # 안에서 chown 을 못 하므로 bootstrap.sh 가 호스트에서 열어 둔다.
      - ./data/voice-models:/models:ro
    networks: [bento]
    # 메모함이 먼저 있어야 한다. 파일이 거기 살아서, 없으면 재생도 전사도 못 한다.
    # (depends_on 은 순서만 정한다. 늦게 뜨는 것은 앱이 다시 부르며 견딘다.)
    depends_on: [mailbento, memobento]

  # 4000 번. 앱들의 채팅창이 서버끼리 부르는 입구다.
  #
  # 밖으로는 127.0.0.1 에만 연다. 앱들은 같은 네트워크 안에서 서비스 이름으로
  # 부르므로 이 포트가 없어도 채팅창은 그대로 돈다 — 열어 두는 것은 같은
  # 기계에서 손으로 확인할 때를 위해서다.
  bentoagent:
    container_name: BentoAgent
    build:
      context: ./src/BentoAgent
      args:
        # 앱들의 mcp/ 를 언제 다시 받을지. bootstrap.sh 가 최근 커밋을 넣는다.
        # PaperBento 는 1단계에 mcp/ 가 없어 아직 여기 끼지 않는다.
        # VoiceBento 도 마찬가지다 — 에이전트는 저쪽의 MCP 를 부르는 것이 아니라,
        # 저쪽이 `/voice/*` 로 이쪽을 부른다 (다듬기·대화). 방향이 반대라 mcp/ 가
        # 생기기 전까지 여기 넣을 것이 없다.
        MCP_CACHEBUST: "${BENTO_MCP_CACHEBUST:-}"
        MEMOBENTO_REF: main
        MAILBENTO_REF: main
    restart: unless-stopped
    environment:
      # 이 스택이 설정을 관리한다는 표시. 없으면 진입 스크립트가
      # 예전 방식(환경변수 직접 주입)으로 보고 앱을 바로 띄운다.
      BENTO_MANAGED: "1"
    ports:
      - "127.0.0.1:${AGENT_PORT:-4000}:4000"
    volumes:
      - ./config:/config
      - ./data/bentoagent:/app/data
      # 대화 자체는 claude 가 자기 홈에 적는다. 밖에 둬야 다시 빌드해도
      # 하던 얘기가 남는다.
      - ./data/claude-home:/home/agent/.claude
    networks: [bento]
    depends_on: [mailbento]

networks:
  bento:
    driver: bridge
